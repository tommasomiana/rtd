<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RTD — Ready to Dance</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>RTD <span class="subtitle">Ready to Dance</span></h1>
      <p class="tagline">Paste a lineup, or upload a screenshot of one. Get a SoundCloud playlist.</p>
      <div id="auth-status" class="auth-status"></div>
    </header>

    <section class="input-tabs">
      <button id="tab-paste" class="tab active">Paste text</button>
      <button id="tab-image" class="tab">Upload screenshot</button>
    </section>

    <section id="paste-panel" class="panel">
      <textarea id="lineup-text" rows="6" placeholder="One artist per line, or comma-separated&#10;e.g.&#10;Acid Arab&#10;Âme b2b Trikk&#10;Floating Points"></textarea>
    </section>

    <section id="image-panel" class="panel hidden">
      <input id="lineup-image" type="file" accept="image/*" />
      <button id="extract-btn" class="secondary">Extract text from image</button>
      <p class="hint">Works best with a clear, cropped screenshot of just the lineup text.</p>
    </section>

    <section class="input-row">
      <button id="find-btn">Find artists on SoundCloud</button>
    </section>

    <section id="lineup" class="lineup hidden"></section>

    <section id="playlist-actions" class="playlist-actions hidden">
      <input id="playlist-title" type="text" placeholder="Playlist name" />
      <button id="create-playlist-btn">Create SoundCloud playlist</button>
    </section>

    <section id="result" class="result hidden"></section>
  </div>

  <script src="app.js"></script>
</body>
</html>
