<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RTD — Ready to Dance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <header>
      <div class="wordmark">
        <span class="eq-bars" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <h1>RtD <span class="subtitle">Ready to Dance</span></h1>
      </div>
      <p class="tagline">event <span class="arrow">→</span> playlist</p>
    </header>

    <section class="step">
      <span class="step-num">1</span>
      <div class="step-body">
        <div class="panel">
          <input id="event-query" type="text" placeholder="e.g. Brunch Electronik 2026, Barcelona" />
          <button id="search-event-btn" class="secondary">Search</button>
          <p class="hint">An AI agent searches the web and proposes matching events to confirm.</p>
          <p id="search-message" class="section-message hidden"></p>
        </div>

        <div id="candidates" class="candidates hidden"></div>

        <section id="loading" class="loading hidden">
          <span class="eq-bars" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
          <span id="loading-text">Loading...</span>
        </section>

        <p id="match-message" class="section-message hidden"></p>

        <section id="lineup" class="lineup hidden">
          <div class="lineup-header">
            <span id="lineup-count-label" class="lineup-count"></span>
            <button id="toggle-view-btn" class="view-toggle" type="button">☰ List view</button>
          </div>
          <div id="bubble-view" class="bubble-view"></div>
          <div id="list-view" class="list-view hidden"></div>
        </section>
      </div>
    </section>

    <section id="playlist-actions" class="step hidden">
      <span class="step-num">2</span>
      <div class="step-body">
        <div class="mode-picker">
          <div class="mode-options">
            <label class="mode-option">
              <input type="radio" name="mode" value="hottest" />
              <span>🔥 Most played</span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="random" />
              <span>🎲 Random</span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="hidden" />
              <span>💎 Hidden gems</span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="fresh" />
              <span>🆕 Freshest</span>
            </label>
          </div>
        </div>

        <div class="playlist-config">
          <label class="tracks-per-artist">
            <span>Tracks per artist</span>
            <input id="tracks-per-artist" type="number" min="1" max="15" value="5" />
          </label>
          <label class="dj-sets-toggle">
            <input type="checkbox" id="include-dj-sets" />
            <span>Include DJ sets / long mixes</span>
          </label>
          <div class="cover-upload">
            <span class="cover-upload-label">Cover image (optional)</span>
            <div class="file-input-row">
              <input id="cover-image" type="file" accept="image/*" class="file-input-hidden" />
              <label for="cover-image" class="file-input-button">📁 Choose image</label>
              <span id="cover-filename" class="file-input-filename">No file chosen</span>
            </div>
          </div>
        </div>

        <div class="playlist-create">
          <input id="playlist-title" type="text" placeholder="Playlist name" />
          <button id="create-playlist-btn" disabled>Create playlist</button>
          <p id="create-requirements" class="section-message hint-message"></p>
        </div>
        <p id="playlist-message" class="section-message hidden"></p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
